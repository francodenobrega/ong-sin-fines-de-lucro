<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Proyecto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>📋 Registro de Proyectos</h1>
        <form id="proyectoForm" action="insertar_proyecto.php" method="POST">
            <label for="nombre">Nombre del proyecto:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" name="descripcion" rows="4" required></textarea>

            <label for="presupuesto">Presupuesto estimado (CLP):</label>
            <input type="number" id="presupuesto" name="presupuesto" min="0" step="0.01" required>

            <label for="fecha_inicio">Fecha de inicio:</label>
            <input type="date" id="fecha_inicio" name="fecha_inicio" required>

            <label for="fecha_fin">Fecha de finalización:</label>
            <input type="date" id="fecha_fin" name="fecha_fin" required>

            <input type="submit" value="Registrar Proyecto">
        </form>

        <br>
        <a href="inicio.html" class="btn-secundario">⬅ Volver al inicio</a>
    </div>

    <script>
    // Validación básica en JS
    document.getElementById('proyectoForm').addEventListener('submit', function(e) {
        const nombre = document.getElementById('nombre').value;
        if (nombre.trim().length < 3) {
            alert("⚠️ El nombre debe tener al menos 3 caracteres.");
            e.preventDefault();
        }
    });
    </script>
</body>
</html>
