<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario de Donación</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="contenedor">
        <h2>💖 Realizar una Donación</h2>
        <form action="insertar_donacion.php" method="POST">
            <label for="id_proyecto">Proyecto:</label>
            <select name="id_proyecto" required>
                <option value="1">Educación Rural</option>
                <option value="2">Salud Comunitaria</option>
            </select>

            <label for="id_donante">Donante (ID):</label>
            <input type="number" name="id_donante" min="1" required>

            <label for="monto">Monto a donar (CLP):</label>
            <input type="number" name="monto" min="1000" required>

            <label for="fecha">Fecha de donación:</label>
            <input type="date" name="fecha" required>

            <button type="submit" class="btn">Donar</button>
        </form>
        <br>
        <a href="inicio.html" class="btn-secundario">⬅ Volver al inicio</a>
    </div>
</body>

</html>
