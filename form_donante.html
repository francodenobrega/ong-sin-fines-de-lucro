<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Donante</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>🧑‍🤝‍🧑 Registro de Donantes</h1>
        <form id="donanteForm" action="insertar_donante.php" method="POST">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>

            <label for="direccion">Dirección:</label>
            <input type="text" id="direccion" name="direccion">

            <label for="telefono">Teléfono de contacto:</label>
            <input type="text" id="telefono" name="telefono">

            <input type="submit" value="Registrar Donante">
        </form>

        <br>
        <a href="inicio.html" class="btn-secundario">⬅ Volver al inicio</a>
    </div>

    <script>
    document.getElementById('donanteForm').addEventListener('submit', function(e) {
        const email = document.getElementById('email').value;
        if (!email.includes("@")) {
            alert("⚠️ Por favor ingresa un correo electrónico válido.");
            e.preventDefault();
        }
    });
    </script>
</body>
</html>
